<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mini Clinic — Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.0.3/qrcode.min.js"></script>
<style>
:root{
  --paper:#F6FAF9; --paper-2:#EAF2F0; --ink:#0F2A2E; --ink-soft:#4B6560;
  --teal:#146B62; --teal-deep:#0C4A44; --coral:#C94430; --line:#CFE0DC;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1B1A; --paper-2:#142524; --ink:#EAF3F1; --ink-soft:#9FBDB7;
    --teal:#4FBFAF; --teal-deep:#7FDCCB; --coral:#EF7B64; --line:#23413C;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1B1A; --paper-2:#142524; --ink:#EAF3F1; --ink-soft:#9FBDB7;
  --teal:#4FBFAF; --teal-deep:#7FDCCB; --coral:#EF7B64; --line:#23413C;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
*{box-sizing:border-box;}
body{margin:0; min-height:100%; background:var(--paper); color:var(--ink); font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;}
.wrap{max-width:520px; margin:0 auto; padding:28px 20px 48px;}
.brand{display:flex; align-items:center; gap:10px; margin-bottom:20px;}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--teal);display:flex;align-items:center;justify-content:center;flex:none;}
.brand .mark svg{width:18px;height:18px;}
.brand h1{font-size:1.15rem;font-weight:700;margin:0;letter-spacing:-0.01em;}
.brand .sub{color:var(--ink-soft);font-size:.8rem;display:block;margin-top:1px;}
.card{background:var(--paper-2);border:1px solid var(--line);border-radius:14px;padding:26px;text-align:center;}
.label{font-size:.72rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;}
.field{text-align:left;margin-bottom:6px;}
.idInput{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:.95rem;}
.idInput:focus{outline:2px solid var(--teal);outline-offset:1px;}
.fieldErr{color:var(--coral);font-size:.8rem;margin-top:6px;min-height:1em;}
button.primary{margin-top:22px;width:100%;padding:14px;border:none;border-radius:10px;background:var(--teal);color:#fff;font:inherit;font-weight:600;font-size:1rem;cursor:pointer;}
button.primary:active{background:var(--teal-deep);}
button.primary:disabled{opacity:.4;cursor:default;}
button.ghost{margin-top:12px;background:none;border:none;color:var(--ink-soft);font:inherit;font-size:.85rem;text-decoration:underline;cursor:pointer;padding:4px;}
.serving-label{font-size:.75rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;}
.serving-num{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:4.2rem;color:var(--teal);margin:8px 0 24px;}
.serving-id{color:var(--ink-soft);font-size:.85rem;margin-top:-16px;margin-bottom:20px;}
.waiting{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px;}
.chip{font-family:'IBM Plex Mono',monospace;font-size:.85rem;background:var(--paper);border:1px solid var(--line);padding:5px 10px;border-radius:7px;}
.empty{color:var(--ink-soft);font-size:.9rem;margin-top:18px;}
.qrbox{background:#fff;padding:14px;border-radius:10px;display:inline-block;line-height:0;}
footer{text-align:center;margin-top:32px;color:var(--ink-soft);font-size:.78rem;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 2v20M2 12h20"/></svg></div>
    <div><h1>Queue</h1><span class="sub">Mini Clinic — Staff</span></div>
  </div>

  <div class="card" id="staffLock">
    <div class="label">Staff access</div>
    <div class="field">
      <input type="password" id="staffCode" class="idInput" placeholder="Enter staff passcode" autocomplete="off">
    </div>
    <div class="fieldErr" id="staffCodeErr"></div>
    <button class="primary" id="unlockBtn">Unlock</button>
  </div>

  <div id="staffContent" hidden>
    <div class="card">
      <div class="serving-label">Now serving</div>
      <div class="serving-num" id="servingNum">—</div>
      <div class="serving-id" id="servingId"></div>
      <button class="primary" id="nextBtn">Call next patient</button>
      <div id="waitingList"></div>
    </div>
    <div class="card" style="margin-top:16px;">
      <div class="serving-label">Scan to take a number</div>
      <div style="margin-top:12px;"><span class="qrbox"><span id="qrHolder"></span></span></div>
    </div>
    <div style="text-align:center;margin-top:16px;">
      <button class="ghost" id="resetBtn">clear queue</button>
    </div>
  </div>
  <footer id="modeNote">Connecting to live cloud…</footer>
</div>

<!-- 1. FIREBASE LIBRARIES -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<!-- 2. FIREBASE CONFIGURATION -->
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBZ9TFjNVtcvSkj_qJsEeDgRxbCqR-u84M",
    authDomain: "clinickiosk-ffbc0.firebaseapp.com",
    databaseURL: "https://clinickiosk-ffbc0-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "clinickiosk-ffbc0",
    storageBucket: "clinickiosk-ffbc0.firebasestorage.app",
    messagingSenderId: "657601053327",
    appId: "1:657601053327:web:9b9adf3bd4f1f3810826fa",
    measurementId: "G-KCBXXT70PY"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
</script>

<!-- 3. APPLICATION LOGIC -->
<script>
let ticketsList = [], servingCreatedAt = null;
const fmt = n => 'A' + String(n).padStart(3, '0');
const ticketNumber = t => 1 + ticketsList.filter(x => x.createdAt < t.createdAt).length;
const waitingTickets = () => ticketsList.filter(t => servingCreatedAt == null || t.createdAt > servingCreatedAt);

function render(){
  const serveTicket = servingCreatedAt != null ? ticketsList.find(x => x.createdAt === servingCreatedAt) : null;
  document.getElementById('servingNum').textContent = serveTicket ? fmt(ticketNumber(serveTicket)) : '—';
  document.getElementById('servingId').textContent = serveTicket && serveTicket.idNumber ? ('ID: ' + serveTicket.idNumber) : '';

  const w = waitingTickets();
  document.getElementById('waitingList').innerHTML = w.length
    ? '<div class="waiting">' + w.map(t => `<span class="chip">${fmt(ticketNumber(t))}</span>`).join('') + '</div>'
    : '<div class="empty">No one waiting</div>';
  document.getElementById('nextBtn').disabled = w.length === 0;
}

// REALTIME FIREBASE SYNC
function startFirebaseListener(){
  db.ref().on('value', (snapshot) => {
    const data = snapshot.val() || {};
    const ticketsObj = data.tickets || {};
    
    // Sort tickets chronologically
    ticketsList = Object.values(ticketsObj).sort((a, b) => a.createdAt - b.createdAt);
    servingCreatedAt = data.servingCreatedAt || null;

    document.getElementById('modeNote').textContent = 'Connected — live Firebase cloud kiosk';
    render();
  }, (error) => {
    document.getElementById('modeNote').textContent = "Can't connect to live database.";
  });
}

// QR CODE GENERATOR
function renderQR(retries){
  retries = retries || 0;
  const holder = document.getElementById('qrHolder');
  if(!holder) return;

  const patientUrl = window.location.href.replace('staff.html', 'patient.html');

  if (typeof qrcode === 'undefined'){
    if (retries < 20){ setTimeout(() => renderQR(retries + 1), 150); return; }
    holder.innerHTML = qrFallback(patientUrl);
    return;
  }
  try{
    const qr = qrcode(0, 'M');
    qr.addData(patientUrl);
    qr.make();
    holder.innerHTML = qr.createImgTag(4, 2);
  }catch(e){
    holder.innerHTML = qrFallback(patientUrl);
  }
}

function qrFallback(url){
  return `<a href="${url}" style="display:block;color:#0F2A2E;font-size:.72rem;padding:4px;max-width:160px;word-break:break-all;">${url}</a>`;
}

// UNLOCK STAFF SCREEN
document.getElementById('unlockBtn').onclick = () => {
  const val = document.getElementById('staffCode').value.trim();
  if(!val){
    document.getElementById('staffCodeErr').textContent = 'Please enter a passcode';
    return;
  }

  try{ localStorage.setItem('miniclinic_staff_code', val); }catch(e){}
  document.getElementById('staffLock').style.display = 'none';
  document.getElementById('staffContent').hidden = false;
  document.getElementById('staffCodeErr').textContent = '';
  
  renderQR();
  startFirebaseListener();
};

document.getElementById('staffCode').addEventListener('keydown', e => { 
  if(e.key === 'Enter') document.getElementById('unlockBtn').click(); 
});

// CALL NEXT PATIENT
document.getElementById('nextBtn').onclick = () => {
  const w = waitingTickets();
  if(w.length === 0) return;

  const nextTicket = w[0];
  db.ref('servingCreatedAt').set(nextTicket.createdAt);
};

// CLEAR QUEUE
document.getElementById('resetBtn').onclick = () => {
  if(confirm("Are you sure you want to clear the queue?")){
    db.ref().remove();
  }
};

// AUTO-FILL SAVED PASSCODE
try{
  const saved = localStorage.getItem('miniclinic_staff_code');
  if(saved){ document.getElementById('staffCode').value = saved; }
}catch(e){}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mini Clinic — Staff Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#0E1B1A; --paper-2:#142524; --ink:#EAF3F1; --ink-soft:#9FBDB7;
  --teal:#4FBFAF; --teal-deep:#7FDCCB; --coral:#EF7B64; --line:#23413C;
  box-sizing:border-box;
}
html{height:100%;}
*{box-sizing:border-box;}
body{margin:0; min-height:100%; background:var(--paper); color:var(--ink); font-family:'Space Grotesk',system-ui,sans-serif; padding:24px;}
.wrap{max-width:800px; margin:0 auto;}
.brand{display:flex; align-items:center; gap:10px; margin-bottom:24px;}
.brand .mark{width:36px;height:36px;border-radius:10px;background:var(--teal);display:flex;align-items:center;justify-content:center;}
.brand h1{font-size:1.2rem;font-weight:700;margin:0;color:var(--ink);}
.brand .sub{color:var(--ink-soft);font-size:.8rem;display:block;}
.card{background:var(--paper-2);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:20px;}
.section-title{font-size:.78rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
.serving-box{text-align:center;padding:18px 0;}
.serving-num{font-family:'IBM Plex Mono',monospace;font-size:3.2rem;font-weight:700;color:var(--teal);line-height:1;margin-bottom:8px;}
.serving-details{color:var(--ink-soft);font-size:.95rem;}
.controls{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px;}
button.primary{padding:14px;border:none;border-radius:10px;background:var(--teal);color:#0E1B1A;font:inherit;font-weight:700;font-size:1rem;cursor:pointer;}
button.primary:active{opacity:0.8;}
button.danger{padding:14px;border:none;border-radius:10px;background:rgba(239,123,100,0.15);color:var(--coral);border:1px solid var(--coral);font:inherit;font-weight:600;font-size:.95rem;cursor:pointer;}
button.danger:active{background:rgba(239,123,100,0.3);}
button.secondary{padding:10px 14px;border:none;border-radius:8px;background:var(--line);color:var(--ink);font:inherit;font-weight:600;font-size:.85rem;cursor:pointer;}
table{width:100%; border-collapse:collapse; margin-top:12px; font-size:.9rem;}
th,td{text-align:left; padding:10px 12px; border-bottom:1px solid var(--line);}
th{color:var(--ink-soft); font-size:.75rem; text-transform:uppercase; letter-spacing:.06em;}
td.mono{font-family:'IBM Plex Mono',monospace;}
.empty-row{text-align:center; color:var(--ink-soft); padding:24px;}
.badge{display:inline-block; padding:3px 8px; border-radius:6px; font-size:.75rem; font-weight:600; background:rgba(79,195,175,0.15); color:var(--teal);}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E1B1A" stroke-width="2.5"><path d="M12 2v20M2 12h20"/></svg></div>
    <div><h1>Staff Control Panel</h1><span class="sub">Mini Clinic — POLIMAS</span></div>
  </div>

  <div class="card">
    <div class="section-title"><span>Currently Serving</span><span id="queueCountBadge" class="badge">0 waiting</span></div>
    <div class="serving-box">
      <div class="serving-num" id="currentServingNum">— — —</div>
      <div class="serving-details" id="currentServingDetails">No patient currently called</div>
    </div>
    <div class="controls">
      <button class="primary" id="callNextBtn">Call Next Patient</button>
      <button class="danger" id="clearActiveQueueBtn">Clear Active Queue</button>
    </div>
  </div>

  <div class="card">
    <div class="section-title">Waiting Queue Line</div>
    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>Queue No.</th>
            <th>Patient Name</th>
            <th>IC Number</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="waitingQueueBody">
          <tr><td colspan="4" class="empty-row">Loading waiting line…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <div class="section-title">
      <span>Daily Patient Registry Log</span>
      <button class="secondary" id="resetRegistryBtn">Reset Daily Registry</button>
    </div>
    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>Queue No.</th>
            <th>Patient Name</th>
            <th>IC Number</th>
            <th>Reg. Date & Time</th>
          </tr>
        </thead>
        <tbody id="registryBody">
          <tr><td colspan="4" class="empty-row">No patients registered today</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBZ9TFjNVtcvSkj_qJsEeDgRxbCqR-u84M",
    authDomain: "clinickiosk-ffbc0.firebaseapp.com",
    databaseURL: "https://clinickiosk-ffbc0-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "clinickiosk-ffbc0",
    storageBucket: "clinickiosk-ffbc0.firebasestorage.app",
    messagingSenderId: "657601053327",
    appId: "1:657601053327:web:9b9adf3bd4f1f3810826fa",
    measurementId: "G-KCBXXT70PY"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let ticketsList = [];
  let registryList = [];
  let servingCreatedAt = null;

  const fmt = n => 'A' + String(n).padStart(3, '0');

  db.ref().on('value', (snapshot) => {
    const data = snapshot.val() || {};
    const ticketsObj = data.tickets || {};
    const registryObj = data.registry || {};

    ticketsList = Object.values(ticketsObj).sort((a, b) => a.createdAt - b.createdAt);
    registryList = Object.values(registryObj).sort((a, b) => b.createdAt - a.createdAt);
    servingCreatedAt = data.servingCreatedAt || null;

    renderStaff();
  });

  function renderStaff(){
    const waiting = servingCreatedAt ? ticketsList.filter(t => t.createdAt > servingCreatedAt) : ticketsList;
    
    document.getElementById('queueCountBadge').textContent = waiting.length + (waiting.length === 1 ? ' waiting' : ' waiting');

    const numEl = document.getElementById('currentServingNum');
    const detailsEl = document.getElementById('currentServingDetails');

    let currentServingTicket = null;
    if (servingCreatedAt) {
      currentServingTicket = ticketsList.find(t => t.createdAt === servingCreatedAt);
    }

    if (currentServingTicket) {
      numEl.textContent = currentServingTicket.ticketNumber || fmt(currentServingTicket.ticketSeq);
      detailsEl.textContent = `${currentServingTicket.name} (${currentServingTicket.idNumber})`;
    } else {
      numEl.textContent = '— — —';
      detailsEl.textContent = waiting.length > 0 ? 'Ready to call next patient' : 'No patients currently in queue';
    }

    const waitingBody = document.getElementById('waitingQueueBody');
    if (waiting.length === 0) {
      waitingBody.innerHTML = `<tr><td colspan="4" class="empty-row">No patients waiting in line</td></tr>`;
    } else {
      waitingBody.innerHTML = waiting.map(t => `
        <tr>
          <td class="mono" style="font-weight:700;color:var(--teal);">${t.ticketNumber || fmt(t.ticketSeq)}</td>
          <td>${t.name}</td>
          <td class="mono">${t.idNumber}</td>
          <td><button class="secondary" onclick="callSpecific('${t.id}')" style="padding:6px 10px;font-size:0.75rem;">Call Now</button></td>
        </tr>
      `).join('');
    }

    const regBody = document.getElementById('registryBody');
    if (registryList.length === 0) {
      regBody.innerHTML = `<tr><td colspan="4" class="empty-row">No patients registered today</td></tr>`;
    } else {
      regBody.innerHTML = registryList.map(r => `
        <tr>
          <td class="mono" style="font-weight:600;">${r.ticketNumber || fmt(r.ticketSeq)}</td>
          <td>${r.name}</td>
          <td class="mono">${r.idNumber}</td>
          <td class="mono" style="font-size:0.8rem;color:var(--ink-soft);">${new Date(r.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'})}</td>
        </tr>
      `).join('');
    }
  }

  document.getElementById('callNextBtn').onclick = () => {
    const waiting = servingCreatedAt ? ticketsList.filter(t => t.createdAt > servingCreatedAt) : ticketsList;
    if(waiting.length === 0){
      alert('No patients waiting in queue!');
      return;
    }

    const nextPatient = waiting[0];
    const now = Date.now();

    const regId = 'reg_' + nextPatient.id;
    const regUpdates = {};
    regUpdates['registry/' + regId] = {
      ...nextPatient,
      completedAt: now
    };
    regUpdates['servingCreatedAt'] = nextPatient.createdAt;
    regUpdates['servingStartedAt'] = now;

    db.ref().update(regUpdates);
  };

  window.callSpecific = (ticketId) => {
    const target = ticketsList.find(t => t.id === ticketId);
    if (!target) return;
    const now = Date.now();

    const regId = 'reg_' + target.id;
    const regUpdates = {};
    regUpdates['registry/' + regId] = {
      ...target,
      completedAt: now
    };
    regUpdates['servingCreatedAt'] = target.createdAt;
    regUpdates['servingStartedAt'] = now;

    db.ref().update(regUpdates);
  };

  document.getElementById('clearActiveQueueBtn').onclick = () => {
    if(confirm('Are you sure you want to clear the active queue?')){
      db.ref('tickets').remove();
      db.ref('servingCreatedAt').remove();
      db.ref('servingStartedAt').remove();
    }
  };

  document.getElementById('resetRegistryBtn').onclick = () => {
    if(confirm('Are you sure you want to clear the entire daily registry log and reset sequence numbers back to A001?')){
      db.ref('registry').remove();
      db.ref('lastSequence').remove();
      db.ref('tickets').remove();
      db.ref('servingCreatedAt').remove();
      db.ref('servingStartedAt').remove();
    }
  };
</script>
</body>
</html>

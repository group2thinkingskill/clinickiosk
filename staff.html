<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mini Clinic Queue System - Staff Control Panel</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b1715] text-slate-100 font-sans min-h-screen pb-12">

  <!-- TOP NAVIGATION BAR -->
  <header class="border-b border-emerald-900/40 bg-[#0e1d1a] px-4 md:px-8 py-3 flex justify-between items-center sticky top-0 z-50 shadow-md">
    <div class="flex items-center gap-3">
      <span class="bg-emerald-500 text-slate-950 font-bold w-8 h-8 flex items-center justify-center rounded-lg text-xl shadow-sm">+</span>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="font-bold text-emerald-400 text-base md:text-lg tracking-wide leading-tight">Mini Clinic Queue System</h1>
          <span class="bg-emerald-900/60 text-emerald-300 text-[10px] font-semibold px-2 py-0.5 rounded-md border border-emerald-700/40">Staff Panel</span>
        </div>
      </div>
    </div>

    <div>
      <a href="index.html" target="_blank" class="bg-[#122320] border border-emerald-900/60 text-emerald-400 hover:bg-emerald-900/40 px-3.5 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5">
        <span>🖥️</span> Open Patient Kiosk ↗
      </a>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-5xl mx-auto p-4 md:p-6 space-y-6">

    <!-- PAGE TITLE & RESET HEADER -->
    <div class="flex justify-between items-start md:items-center flex-col md:flex-row gap-4 pt-2">
      <div class="flex items-center gap-3">
        <span class="text-emerald-400 font-black text-2xl">+</span>
        <div>
          <h2 class="text-xl font-bold text-white tracking-wide">Staff Control Panel</h2>
          <p class="text-xs text-gray-400">Mini Clinic — Doctor Console</p>
        </div>
      </div>

      <button onclick="resetEverything()" class="bg-rose-950/60 hover:bg-rose-900 border border-rose-800/80 text-rose-300 px-4 py-2 rounded-xl text-xs font-semibold transition flex items-center gap-2 shadow-sm">
        <span>⚠️</span> Reset Everything (Queue & Log)
      </button>
    </div>

    <!-- SEARCH BAR -->
    <div class="relative">
      <span class="absolute left-4 top-3 text-gray-400 text-sm">🔍</span>
      <input type="text" id="staff-search" oninput="renderUI()" placeholder="Search patient by Name or IC Number..." 
        class="w-full bg-[#122320] border border-emerald-900/60 rounded-xl py-2.5 pl-11 pr-4 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-emerald-500 transition"/>
    </div>

    <!-- CURRENTLY SERVING BOX -->
    <div class="bg-[#122320] border border-emerald-900/60 rounded-2xl p-6 shadow-xl">
      <p class="text-[10px] font-bold text-emerald-400 uppercase tracking-widest mb-4">CURRENTLY SERVING</p>
      <div id="serving-card-content" class="text-center py-4">
        <!-- Rendered via JS -->
      </div>
    </div>

    <!-- WAITING PATIENTS LIST -->
    <div class="space-y-3">
      <h3 id="waiting-patients-title" class="text-emerald-400 font-bold text-xs tracking-wide">
        Waiting Patients (0)
      </h3>
      <div id="waiting-patients-list" class="space-y-2">
        <!-- Rendered via JS -->
      </div>
    </div>

    <!-- TODAY'S PATIENT LOG -->
    <div class="pt-4 space-y-3">
      <div class="flex justify-between items-center">
        <h3 id="log-title" class="text-emerald-400 font-bold text-xs tracking-wide">
          Today's Patient Log
        </h3>
        <span id="served-count-badge" class="bg-emerald-950 text-emerald-400 text-xs px-3 py-1 rounded-full border border-emerald-800/50 font-medium">
          0 served
        </span>
      </div>
      <div id="patient-log-list" class="space-y-2">
        <!-- Rendered via JS -->
      </div>
    </div>

  </main>

  <script>
    let state = {
      ticketCounter: parseInt(localStorage.getItem('mc_ticketCounter') || '1', 10),
      queue: JSON.parse(localStorage.getItem('mc_queue') || '[]'),
      currentlyServing: JSON.parse(localStorage.getItem('mc_currentlyServing') || 'null'),
      patientLog: JSON.parse(localStorage.getItem('mc_patientLog') || '[]'),
      lastTicket: JSON.parse(localStorage.getItem('mc_lastTicket') || 'null')
    };

    function loadState() {
      state.ticketCounter = parseInt(localStorage.getItem('mc_ticketCounter') || '1', 10);
      state.queue = JSON.parse(localStorage.getItem('mc_queue') || '[]');
      state.currentlyServing = JSON.parse(localStorage.getItem('mc_currentlyServing') || 'null');
      state.patientLog = JSON.parse(localStorage.getItem('mc_patientLog') || '[]');
      state.lastTicket = JSON.parse(localStorage.getItem('mc_lastTicket') || 'null');
      renderUI();
    }

    function saveState() {
      localStorage.setItem('mc_ticketCounter', state.ticketCounter.toString());
      localStorage.setItem('mc_queue', JSON.stringify(state.queue));
      localStorage.setItem('mc_currentlyServing', JSON.stringify(state.currentlyServing));
      localStorage.setItem('mc_patientLog', JSON.stringify(state.patientLog));
      localStorage.setItem('mc_lastTicket', JSON.stringify(state.lastTicket));
      renderUI();
    }

    // Real-time synchronization when patient registers on index.html
    window.addEventListener('storage', loadState);

    function announceTicket(ticketNo) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(`Number ${ticketNo}, please proceed to Consultation Room 1`);
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    function callNextPatient() {
      if (state.queue.length === 0) return;

      const timeString = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const next = state.queue.shift();
      next.calledAt = timeString;

      state.currentlyServing = next;
      saveState();
      announceTicket(next.ticketNo);
    }

    function finishServing() {
      if (!state.currentlyServing) return;

      const timeString = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const completedRecord = {
        ...state.currentlyServing,
        completedAt: timeString
      };

      state.patientLog.unshift(completedRecord);
      state.currentlyServing = null;
      saveState();
    }

    function resetEverything() {
      if (confirm('Are you sure you want to RESET EVERYTHING?\n\nThis will clear:\n• All waiting tickets\n• Active serving patient\n• Today\'s patient log\n• Reset ticket counter to A001')) {
        state.queue = [];
        state.currentlyServing = null;
        state.patientLog = [];
        state.ticketCounter = 1;
        state.lastTicket = null;

        localStorage.clear();
        saveState();
      }
    }

    function renderUI() {
      const servingContainer = document.getElementById('serving-card-content');
      
      if (state.currentlyServing) {
        servingContainer.innerHTML = `
          <div class="flex flex-col md:flex-row items-center justify-between gap-4 text-left">
            <div>
              <div class="text-6xl font-black text-emerald-400 tracking-tight my-1">${state.currentlyServing.ticketNo}</div>
              <div class="text-lg font-bold text-white">${state.currentlyServing.name}</div>
              <p class="text-xs text-gray-400 mt-0.5">IC: ${state.currentlyServing.icNumber} • Service: ${state.currentlyServing.category || 'General'}</p>
              <p class="text-[11px] text-emerald-400/80 mt-1 font-medium">Called at ${state.currentlyServing.calledAt}</p>
            </div>
            <div class="flex flex-wrap gap-2 w-full md:w-auto mt-2 md:mt-0">
              <button onclick="announceTicket('${state.currentlyServing.ticketNo}')" class="bg-[#0b1715] hover:bg-emerald-900/40 border border-emerald-800 text-emerald-400 font-bold py-2.5 px-4 rounded-xl text-xs transition">
                🔊 Re-Announce
              </button>
              <button onclick="callNextPatient()" ${state.queue.length === 0 ? 'disabled' : ''} 
                class="bg-emerald-500 hover:bg-emerald-400 disabled:opacity-30 text-slate-950 font-bold py-2.5 px-5 rounded-xl transition text-xs shadow-lg">
                Call Next Patient →
              </button>
              <button onclick="finishServing()" class="bg-rose-500 hover:bg-rose-400 text-white font-bold py-2.5 px-5 rounded-xl transition text-xs shadow-lg">
                Mark Finished
              </button>
            </div>
          </div>
        `;
      } else {
        servingContainer.innerHTML = `
          <p class="text-gray-400 text-xs mb-4">No patient currently in consultation.</p>
          <button onclick="callNextPatient()" ${state.queue.length === 0 ? 'disabled' : ''} 
            class="bg-emerald-500 hover:bg-emerald-400 disabled:opacity-30 text-slate-950 font-bold py-3 px-6 rounded-xl transition text-xs shadow-lg">
            Call Next Patient (${state.queue.length} Waiting)
          </button>
        `;
      }

      const query = document.getElementById('staff-search').value.toLowerCase().trim();

      // Waiting List Filter
      const filteredQueue = state.queue.filter(p => 
        p.name.toLowerCase().includes(query) || p.icNumber.includes(query) || p.ticketNo.toLowerCase().includes(query)
      );

      document.getElementById('waiting-patients-title').innerText = `Waiting Patients (${filteredQueue.length})`;

      const waitingContainer = document.getElementById('waiting-patients-list');
      if (filteredQueue.length === 0) {
        waitingContainer.innerHTML = `<p class="text-center text-gray-500 text-xs py-4">No waiting patients found</p>`;
      } else {
        waitingContainer.innerHTML = filteredQueue.map((p, index) => `
          <div class="bg-[#122320] border border-emerald-900/50 p-4 rounded-xl flex justify-between items-center">
            <div class="flex items-center gap-4">
              <span class="font-black text-emerald-400 text-lg">${p.ticketNo}</span>
              <div>
                <p class="text-xs font-bold text-white">${p.name}</p>
                <p class="text-[10px] text-gray-400">IC: ${p.icNumber}</p>
              </div>
            </div>
            <div class="text-right">
              <span class="text-[10px] text-gray-400 block">Reg: ${p.registeredAt}</span>
              <span class="text-[10px] text-emerald-400 font-medium">#${index + 1} in line</span>
            </div>
          </div>
        `).join('');
      }

      // Log Filter
      const filteredLog = state.patientLog.filter(p => 
        p.name.toLowerCase().includes(query) || p.icNumber.includes(query) || p.ticketNo.toLowerCase().includes(query)
      );

      const dateStr = new Date().toLocaleDateString("en-GB", { day: '2-digit', month: 'short', year: 'numeric' });
      document.getElementById('log-title').innerText = `Today's Patient Log (${dateStr})`;
      document.getElementById('served-count-badge').innerText = `${state.patientLog.length} served`;

      const logContainer = document.getElementById('patient-log-list');
      if (filteredLog.length === 0) {
        logContainer.innerHTML = `<p class="text-center text-gray-500 text-xs py-6">No completed sessions logged</p>`;
      } else {
        logContainer.innerHTML = filteredLog.map(p => `
          <div class="bg-[#122320]/60 border border-emerald-900/30 p-3.5 rounded-xl flex justify-between items-center">
            <div class="flex items-center gap-4">
              <span class="font-bold text-gray-400 text-sm">${p.ticketNo}</span>
              <div>
                <p class="text-xs font-bold text-gray-200">${p.name}</p>
                <p class="text-[10px] text-gray-500">IC: ${p.icNumber}</p>
              </div>
            </div>
            <div class="text-right">
              <span class="text-[10px] bg-emerald-900/40 text-emerald-300 px-2 py-0.5 rounded border border-emerald-800/40">Completed</span>
              <p class="text-[10px] text-gray-400 mt-1">${p.completedAt}</p>
            </div>
          </div>
        `).join('');
      }
    }

    loadState();
  </script>
</body>
</html>

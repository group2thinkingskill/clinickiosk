<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Clinic — Staff Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6FAF9; --paper-2:#EAF2F0; --ink:#0F2A2E; --ink-soft:#4B6560;
  --teal:#146B62; --coral:#C94430; --amber:#D99B00; --line:#CFE0DC;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#0E1B1A; --paper-2:#142524; --ink:#EAF3F1; --ink-soft:#9FBDB7; --teal:#4FBFAF; --coral:#EF7B64; --amber:#F3C649; --line:#23413C; }
}
*{box-sizing:border-box;}
body{margin:0; background:var(--paper); color:var(--ink); font-family:'Space Grotesk',sans-serif;}
.wrap{max-width:850px; margin:0 auto; padding:28px 20px 48px;}
.header{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:1px solid var(--line); padding-bottom:16px; flex-wrap:wrap; gap:12px;}
.header h1{font-size:1.4rem; margin:0;}
.date-badge{font-size:.85rem; color:var(--ink-soft); font-weight:600;}
.header-actions{display:flex; gap:10px; flex-wrap:wrap;}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:24px;}
.card{background:var(--paper-2); border:1px solid var(--line); border-radius:14px; padding:20px; text-align:center;}
.label{font-size:.72rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.08em; margin-bottom:8px;}
.stat{font-family:'IBM Plex Mono',monospace; font-size:2.8rem; font-weight:700; color:var(--teal);}
button.btn{padding:10px 16px; border:none; border-radius:8px; background:var(--teal); color:#fff; font-weight:600; cursor:pointer; font-size:.88rem;}
button.btn-coral{background:var(--coral);}
button.btn-amber{background:var(--amber); color:#000;}
button.btn:hover{opacity:0.9;}
table{width:100%; border-collapse:collapse; margin-top:16px; background:var(--paper-2); border-radius:12px; overflow:hidden; border:1px solid var(--line);}
th, td{padding:12px 16px; text-align:left; border-bottom:1px solid var(--line); font-size:.9rem;}
th{font-size:.75rem; text-transform:uppercase; color:var(--ink-soft); letter-spacing:.05em;}
.status-badge{display:inline-block; padding:3px 8px; border-radius:6px; font-size:.75rem; font-weight:700;}
.st-waiting{background:#E0A10022; color:var(--amber);}
.st-serving{background:#146B6222; color:var(--teal);}
.st-done{background:#88888822; color:var(--ink-soft);}
.top-bar{display:flex; justify-content:space-between; align-items:center; margin-top:24px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div>
      <h1>Staff Control Dashboard</h1>
      <div id="todayDate" class="date-badge"></div>
    </div>
    <div class="header-actions">
      <button class="btn btn-amber" id="clearQueueBtn">🧹 Clear Active Queue (Keep Log)</button>
      <button class="btn btn-coral" id="resetAllBtn">🗑️ Reset Everything</button>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="label">Total Patients Logged Today</div>
      <div class="stat" id="totalCount">0</div>
    </div>
    <div class="card">
      <div class="label">Now Serving</div>
      <div class="stat" id="servingNum">— — —</div>
      <button class="btn" id="callNextBtn" style="margin-top:10px;">Call Next Patient</button>
    </div>
  </div>

  <div class="top-bar">
    <h2 style="font-size:1.1rem; margin:0;">Today's Patient Log</h2>
    <span id="waitingCount" style="font-size:.85rem; color:var(--ink-soft);">0 active waiting</span>
  </div>

  <table>
    <thead>
      <tr>
        <th>No.</th>
        <th>Ticket</th>
        <th>Time</th>
        <th>Patient Name</th>
        <th>ID Number</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="patientTableBody">
      <tr><td colspan="6" style="text-align:center; color:var(--ink-soft);">No patients checked in today.</td></tr>
    </tbody>
  </table>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBZ9TFjNVtcvSkj_qJsEeDgRxbCqR-u84M",
    authDomain: "clinickiosk-ffbc0.firebaseapp.com",
    databaseURL: "https://clinickiosk-ffbc0-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "clinickiosk-ffbc0",
    storageBucket: "clinickiosk-ffbc0.firebasestorage.app",
    messagingSenderId: "657601053327",
    appId: "1:657601053327:web:9b9adf3bd4f1f3810826fa",
    measurementId: "G-KCBXXT70PY"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  document.getElementById('todayDate').textContent = new Date().toLocaleDateString('en-US', {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
  });

  let activeTickets = [];
  let historyTickets = [];
  let allPatients = [];
  let servingCreatedAt = null;

  const fmt = n => 'A' + String(n).padStart(3, '0');

  db.ref().on('value', (snapshot) => {
    const data = snapshot.val() || {};
    const ticketsObj = data.tickets || {};
    const historyObj = data.history || {};

    activeTickets = Object.values(ticketsObj).sort((a, b) => a.createdAt - b.createdAt);
    historyTickets = Object.values(historyObj).sort((a, b) => a.createdAt - b.createdAt);

    // Merge active and history list without duplicates
    const patientMap = {};
    historyTickets.forEach(t => patientMap[t.id] = { ...t, isArchived: true });
    activeTickets.forEach(t => patientMap[t.id] = { ...t, isArchived: false });

    allPatients = Object.values(patientMap).sort((a, b) => a.createdAt - b.createdAt);
    servingCreatedAt = data.servingCreatedAt || null;

    renderStaff();
  });

  function renderStaff(){
    document.getElementById('totalCount').textContent = allPatients.length;

    const currentServingTicket = activeTickets.find(t => t.createdAt === servingCreatedAt);
    const servingNumEl = document.getElementById('servingNum');
    
    if(currentServingTicket){
      const idx = allPatients.findIndex(t => t.id === currentServingTicket.id);
      servingNumEl.textContent = fmt(idx + 1);
    } else {
      servingNumEl.textContent = "— — —";
    }

    const waiting = activeTickets.filter(t => servingCreatedAt == null || t.createdAt > servingCreatedAt);
    document.getElementById('waitingCount').textContent = waiting.length + " active waiting";

    const tbody = document.getElementById('patientTableBody');
    if(allPatients.length === 0){
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:var(--ink-soft);">No patients checked in today.</td></tr>`;
      return;
    }

    tbody.innerHTML = allPatients.map((t, i) => {
      const ticketNo = fmt(i + 1);
      const timeStr = new Date(t.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      
      let stClass = "st-waiting", stText = "Waiting";
      if(t.isArchived){
        stClass = "st-done"; stText = "Archived / Cleared";
      } else if(servingCreatedAt && t.createdAt === servingCreatedAt){
        stClass = "st-serving"; stText = "Serving";
      } else if(servingCreatedAt && t.createdAt < servingCreatedAt){
        stClass = "st-done"; stText = "Completed";
      }

      return `
        <tr>
          <td>${i + 1}</td>
          <td><strong>${ticketNo}</strong></td>
          <td>${timeStr}</td>
          <td>${t.name || 'Anonymous'}</td>
          <td>${t.idNumber || '—'}</td>
          <td><span class="status-badge ${stClass}">${stText}</span></td>
        </tr>
      `;
    }).join('');
  }

  document.getElementById('callNextBtn').onclick = () => {
    const waiting = activeTickets.filter(t => servingCreatedAt == null || t.createdAt > servingCreatedAt);
    if(waiting.length === 0){
      alert("No waiting patients in queue.");
      return;
    }
    const nextTicket = waiting[0];
    db.ref('servingCreatedAt').set(nextTicket.createdAt);
  };

  // CLEAR ACTIVE QUEUE ONLY (KEEPS TODAY'S LOG IN HISTORY)
  document.getElementById('clearQueueBtn').onclick = () => {
    if(activeTickets.length === 0){
      alert("Active queue is already empty.");
      return;
    }

    if(confirm("Clear active queue for patient screens? Today's patient names and total counts will remain saved in the log.")){
      db.ref('tickets').once('value').then(snap => {
        const currTickets = snap.val() || {};
        const updates = {};
        
        // Move active tickets to history node
        Object.keys(currTickets).forEach(key => {
          updates['history/' + key] = currTickets[key];
        });
        updates['tickets'] = null;
        updates['servingCreatedAt'] = null;

        return db.ref().update(updates);
      }).then(() => {
        alert("Active queue cleared! Patient screens are reset, records preserved.");
      });
    }
  };

  // FULL RESET (WIPES EVERYTHING INCLUDING LOGS)
  document.getElementById('resetAllBtn').onclick = () => {
    if(confirm("Are you sure you want to delete ALL records and reset the entire system?")){
      db.ref().remove().then(() => {
        alert("All records and queue data wiped.");
      });
    }
  };
</script>
</body>
</html>

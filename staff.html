<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mini Clinic — Staff Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#0E1B1A; --paper-2:#142524; --ink:#EAF3F1; --ink-soft:#9FBDB7;
  --teal:#4FBFAF; --teal-deep:#7FDCCB; --coral:#EF7B64; --line:#23413C;
  --danger:#FF5252; --danger-hover:#D32F2F;
  box-sizing:border-box;
}
*{box-sizing:border-box;}
body{
  margin:0; min-height:100vh; background:var(--paper); color:var(--ink);
  font-family:'Space Grotesk',system-ui,-apple-system,sans-serif; padding:24px;
}
.wrap{max-width:840px; margin:0 auto;}
.header-bar{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;}
.brand{display:flex; align-items:center; gap:10px;}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--teal);display:flex;align-items:center;justify-content:center;flex:none;}
.brand .mark svg{width:18px;height:18px;}
.brand h1{font-size:1.15rem;font-weight:700;margin:0;}
.brand .sub{color:var(--ink-soft);font-size:.8rem;display:block;}

.card{background:var(--paper-2);border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:24px;}
.card-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
.card-title{font-size:.75rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;margin:0;font-weight:700;}

/* Search */
.search-box{position:relative;}
.search-input{
  width:100%; padding:14px 16px 14px 42px; border-radius:10px; border:1px solid var(--line);
  background:var(--paper); color:var(--ink); font:inherit; font-size:.95rem;
}
.search-input:focus{outline:2px solid var(--teal); outline-offset:1px;}
.search-icon{position:absolute; left:14px; top:50%; transform:translateY(-50%); opacity:0.6;}

/* Currently Serving */
.serving-box{text-align:center; padding:10px 0;}
.serving-num{font-family:'IBM Plex Mono',monospace; font-size:4rem; font-weight:700; color:var(--coral); line-height:1; margin:10px 0;}
.patient-details{background:rgba(20,107,98,0.12); border:1px solid var(--line); border-radius:10px; padding:14px; margin:16px 0;}
.patient-name{font-size:1.2rem; font-weight:700; color:var(--teal-deep); margin-bottom:4px;}
.patient-ic{font-family:'IBM Plex Mono',monospace; font-size:.9rem; color:var(--ink-soft);}

.btn-group{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px;}
button{
  padding:14px; border:none; border-radius:10px; font:inherit; font-weight:700; font-size:1rem; cursor:pointer; transition:all 0.15s ease;
}
button.btn-call{background:var(--teal); color:#0E1B1A;}
button.btn-call:hover{opacity:0.9;}
button.btn-done{background:var(--coral); color:#fff;}
button.btn-done:hover{opacity:0.9;}
button:disabled{opacity:0.4; cursor:not-allowed;}

button.btn-reset{
  background:rgba(239, 123, 100, 0.15); color:var(--coral); border:1px solid var(--coral);
  padding:6px 14px; font-size:.78rem; font-weight:600; border-radius:8px; cursor:pointer; display:flex; align-items:center; gap:6px;
}
button.btn-reset:hover{background:var(--coral); color:#fff;}

/* Log Table */
.table-wrap{overflow-x:auto;}
table{width:100%; border-collapse:collapse; text-align:left; font-size:.9rem;}
th{font-size:.7rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.08em; padding:12px 10px; border-bottom:1px solid var(--line);}
td{padding:14px 10px; border-bottom:1px solid rgba(35,65,60,0.5); font-size:.9rem;}
td.q-num{font-family:'IBM Plex Mono',monospace; font-weight:700; color:var(--ink);}
td.ic-num{font-family:'IBM Plex Mono',monospace; color:var(--ink-soft);}
td.time-col{color:var(--ink-soft); font-size:.82rem;}
tr:last-child td{border-bottom:none;}
.empty-table{text-align:center; color:var(--ink-soft); padding:24px 0;}
</style>
</head>
<body>

<div class="wrap">
  <div class="header-bar">
    <div class="brand">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 2v20M2 12h20"/></svg></div>
      <div><h1>Queue System</h1><span class="sub">Mini Clinic — Staff Counter</span></div>
    </div>
  </div>

  <!-- Search Card -->
  <div class="card">
    <div class="card-title" style="margin-bottom:12px;">Patient Search & Lookup</div>
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" class="search-input" placeholder="Enter Full Name or 12-Digit IC Number to search..." autocomplete="off">
    </div>
  </div>

  <!-- Serving Card -->
  <div class="card">
    <div class="serving-box">
      <div class="card-title">Currently Serving</div>
      <div class="serving-num" id="servingNumDisplay">— — —</div>
      
      <div class="patient-details" id="patientDetailBox" style="display:none;">
        <div class="patient-name" id="servingName">—</div>
        <div class="patient-ic" id="servingIc">IC: —</div>
      </div>

      <div class="btn-group">
        <button class="btn-call" id="callNextBtn">Call Next Patient</button>
        <button class="btn-done" id="markDoneBtn" disabled>Mark Completed / Done</button>
      </div>
    </div>
  </div>

  <!-- Log Table Card -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">Daily Patient Registry Log</div>
      <button class="btn-reset" id="resetLogBtn">
        🔄 Reset Daily Registry
      </button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Queue No.</th>
            <th>Patient Name</th>
            <th>IC Number</th>
            <th>Reg. Date & Time</th>
          </tr>
        </thead>
        <tbody id="logTableBody">
          <tr><td colspan="4" class="empty-table">Loading daily records…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBZ9TFjNVtcvSkj_qJsEeDgRxbCqR-u84M",
    authDomain: "clinickiosk-ffbc0.firebaseapp.com",
    databaseURL: "https://clinickiosk-ffbc0-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "clinickiosk-ffbc0",
    storageBucket: "clinickiosk-ffbc0.firebasestorage.app",
    messagingSenderId: "657601053327",
    appId: "1:657601053327:web:9b9adf3bd4f1f3810826fa",
    measurementId: "G-KCBXXT70PY"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let allTickets = [];
  let currentServingCreatedAt = null;
  let filterQuery = "";

  const fmt = n => 'A' + String(n).padStart(3, '0');

  function formatDateTime(timestamp){
    if(!timestamp) return '—';
    const d = new Date(timestamp);
    const dateStr = d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
    const timeStr = d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
    return `${dateStr} ${timeStr}`;
  }

  function renderStaffView(){
    // Filter tickets based on search query
    const filtered = allTickets.filter(t => {
      if(!filterQuery) return true;
      const q = filterQuery.toLowerCase();
      return (t.name && t.name.toLowerCase().includes(q)) || 
             (t.idNumber && t.idNumber.includes(q)) ||
             (t.ticketNumber && t.ticketNumber.toLowerCase().includes(q));
    });

    // Render Table
    const tbody = document.getElementById('logTableBody');
    if(filtered.length === 0){
      tbody.innerHTML = `<tr><td colspan="4" class="empty-table">${filterQuery ? 'No matching records found' : 'No patients registered today'}</td></tr>`;
    } else {
      tbody.innerHTML = filtered.map(t => `
        <tr>
          <td class="q-num">${t.ticketNumber || fmt(t.ticketSeq)}</td>
          <td><strong>${t.name || 'Unknown'}</strong></td>
          <td class="ic-num">${t.idNumber || '—'}</td>
          <td class="time-col">${formatDateTime(t.createdAt)}</td>
        </tr>
      `).join('');
    }

    // Render Currently Serving
    const servingNumDisplay = document.getElementById('servingNumDisplay');
    const patientDetailBox = document.getElementById('patientDetailBox');
    const servingName = document.getElementById('servingName');
    const servingIc = document.getElementById('servingIc');
    const markDoneBtn = document.getElementById('markDoneBtn');

    const currentlyServing = allTickets.find(t => t.createdAt === currentServingCreatedAt);

    if(currentlyServing){
      servingNumDisplay.textContent = currentlyServing.ticketNumber || fmt(currentlyServing.ticketSeq);
      servingName.textContent = currentlyServing.name;
      servingIc.textContent = `IC: ${currentlyServing.idNumber}`;
      patientDetailBox.style.display = 'block';
      markDoneBtn.disabled = false;
    } else {
      servingNumDisplay.textContent = '— — —';
      patientDetailBox.style.display = 'none';
      markDoneBtn.disabled = true;
    }
  }

  // Database Listener
  db.ref().on('value', (snapshot) => {
    const data = snapshot.val() || {};
    const ticketsObj = data.tickets || {};

    allTickets = Object.values(ticketsObj).sort((a, b) => a.createdAt - b.createdAt);
    currentServingCreatedAt = data.servingCreatedAt || null;

    renderStaffView();
  });

  // Call Next Patient
  document.getElementById('callNextBtn').onclick = () => {
    const waiting = allTickets.filter(t => !currentServingCreatedAt || t.createdAt > currentServingCreatedAt);
    if(waiting.length === 0){
      alert('No more waiting patients in queue!');
      return;
    }

    const nextPatient = waiting[0];
    db.ref().update({
      servingCreatedAt: nextPatient.createdAt,
      servingStartedAt: Date.now()
    });
  };

  // Mark Completed / Done
  document.getElementById('markDoneBtn').onclick = () => {
    if(!currentServingCreatedAt) return;
    
    // Clear active serving state
    db.ref('servingStartedAt').remove();
    // Move serving cursor forward or keep current to allow calling next
    renderStaffView();
  };

  // Search input event
  document.getElementById('searchInput').addEventListener('input', (e) => {
    filterQuery = e.target.value.trim();
    renderStaffView();
  });

  // RESET LOG & QUEUE COUNTER
  document.getElementById('resetLogBtn').onclick = () => {
    const confirmReset = confirm("⚠️ Are you sure you want to reset the registry log?\n\nThis will clear all patient records, clear the live queue, and reset the queue ticket counter back to A001.");
    
    if (confirmReset) {
      db.ref().update({
        tickets: null,
        dailyCounter: 0,
        servingCreatedAt: null,
        servingStartedAt: null
      }).then(() => {
        alert("✅ Queue and Registry Log have been successfully reset to A001!");
      }).catch((err) => {
        alert("Failed to reset: " + err.message);
      });
    }
  };
</script>
</body>
</html>

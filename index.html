<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Staff Control Panel - Mini Clinic Queue System</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b1715] text-slate-100 font-sans min-h-screen">

  <!-- TOP BAR -->
  <header class="border-b border-emerald-900/40 bg-[#0e1d1a] px-6 py-3 flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center gap-2">
      <span class="bg-emerald-500 text-slate-950 font-bold w-7 h-7 flex items-center justify-center rounded-lg text-lg">+</span>
      <span class="font-bold text-emerald-400 text-base md:text-lg tracking-wide">Mini Clinic Queue System</span>
      <span class="bg-emerald-500/20 text-emerald-400 text-xs px-2.5 py-0.5 rounded-full border border-emerald-800/50 font-semibold ml-2">Staff Panel</span>
    </div>
    
    <a href="patient.html" target="_blank" class="text-xs text-emerald-400 hover:text-emerald-300 bg-[#122320] border border-emerald-900/60 px-3.5 py-1.5 rounded-lg hover:bg-emerald-900/30 transition flex items-center gap-1.5 font-medium">
      <span>🖥️</span> Open Patient Kiosk ↗
    </a>
  </header>

  <main class="max-w-4xl mx-auto p-4 md:p-6 space-y-6">
    
    <!-- Staff Panel Header with Reset Everything Button -->
    <div class="flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold flex items-center gap-2 text-white">
          <span class="bg-emerald-500/20 text-emerald-400 p-1.5 rounded-lg text-sm">✚</span>
          Staff Control Panel
        </h1>
        <p class="text-xs text-gray-400">Mini Clinic — Doctor Console</p>
      </div>
      
      <!-- RESET EVERYTHING BUTTON -->
      <button onclick="resetEverything()" class="text-xs text-rose-300 hover:text-white bg-rose-950/60 border border-rose-800/80 px-3.5 py-2 rounded-lg hover:bg-rose-700 transition font-medium flex items-center gap-1.5">
        <span>⚠️</span> Reset Everything (Queue & Log)
      </button>
    </div>

    <!-- Search Bar -->
    <div class="relative">
      <span class="absolute left-3.5 top-2.5 text-gray-400 text-sm">🔍</span>
      <input type="text" id="staff-search" oninput="renderUI()" placeholder="Search patient by Name or IC Number..." 
        class="w-full bg-[#122320]/80 border border-emerald-900/50 rounded-xl py-2.5 pl-10 pr-4 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-emerald-500 transition"/>
    </div>

    <!-- Currently Serving Container -->
    <div class="bg-[#122320] border border-emerald-800/40 rounded-xl p-6 shadow-xl">
      <p class="text-[11px] font-bold tracking-wider text-emerald-400/80 uppercase mb-2">CURRENTLY SERVING</p>
      <div id="serving-card-content">
        <!-- Dynamic Serving Content Rendered via JS -->
      </div>
    </div>

    <!-- Waiting Patients Section -->
    <div>
      <div class="border-b border-emerald-900/40 pb-2 mb-3">
        <h2 id="waiting-patients-title" class="text-emerald-400 font-semibold text-xs tracking-wide">
          Waiting Patients (0)
        </h2>
      </div>
      <div id="waiting-patients-list" class="space-y-2">
        <!-- Dynamic Waiting Queue Rendered via JS -->
      </div>
    </div>

    <!-- Today's Patient Log Section -->
    <div>
      <div class="flex justify-between items-center border-b border-emerald-900/40 pb-2 mb-3">
        <h2 id="log-title" class="text-emerald-400 font-semibold text-xs tracking-wide">
          Today's Patient Log
        </h2>
        <span id="served-count-badge" class="bg-emerald-900/40 text-emerald-400 text-xs px-2.5 py-0.5 rounded-full border border-emerald-700/30">
          0 served
        </span>
      </div>
      <div id="patient-log-list" class="space-y-2">
        <!-- Dynamic Log Rendered via JS -->
      </div>
    </div>

  </main>

  <!-- STAFF JAVASCRIPT LOGIC -->
  <script>
    let state = {
      ticketCounter: parseInt(localStorage.getItem('mc_ticketCounter') || '1', 10),
      queue: JSON.parse(localStorage.getItem('mc_queue') || '[]'),
      currentlyServing: JSON.parse(localStorage.getItem('mc_currentlyServing') || 'null'),
      patientLog: JSON.parse(localStorage.getItem('mc_patientLog') || '[]'),
      lastTicket: JSON.parse(localStorage.getItem('mc_lastTicket') || 'null')
    };

    function saveState() {
      localStorage.setItem('mc_ticketCounter', state.ticketCounter.toString());
      localStorage.setItem('mc_queue', JSON.stringify(state.queue));
      localStorage.setItem('mc_currentlyServing', JSON.stringify(state.currentlyServing));
      localStorage.setItem('mc_patientLog', JSON.stringify(state.patientLog));
      localStorage.setItem('mc_lastTicket', JSON.stringify(state.lastTicket));
      renderUI();
    }

    // Synchronize instantly when patients register on patient.html
    window.addEventListener('storage', () => {
      state.ticketCounter = parseInt(localStorage.getItem('mc_ticketCounter') || '1', 10);
      state.queue = JSON.parse(localStorage.getItem('mc_queue') || '[]');
      state.currentlyServing = JSON.parse(localStorage.getItem('mc_currentlyServing') || 'null');
      state.patientLog = JSON.parse(localStorage.getItem('mc_patientLog') || '[]');
      state.lastTicket = JSON.parse(localStorage.getItem('mc_lastTicket') || 'null');
      renderUI();
    });

    function callNextPatient() {
      if (state.queue.length === 0) return;

      const timeString = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const next = state.queue.shift();
      next.calledAt = timeString;

      state.currentlyServing = next;
      saveState();
    }

    function finishServing() {
      if (!state.currentlyServing) return;

      const timeString = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const completedRecord = {
        ...state.currentlyServing,
        completedAt: timeString
      };

      state.patientLog.unshift(completedRecord);
      state.currentlyServing = null;
      saveState();
    }

    function resetEverything() {
      if (confirm('Are you sure you want to RESET EVERYTHING?\n\nThis will permanently wipe:\n• Active waiting queue\n• Currently serving patient\n• Complete patient log history\n• Reset ticket counter back to A001')) {
        state.queue = [];
        state.currentlyServing = null;
        state.patientLog = [];
        state.ticketCounter = 1;
        state.lastTicket = null;

        localStorage.removeItem('mc_ticketCounter');
        localStorage.removeItem('mc_queue');
        localStorage.removeItem('mc_currentlyServing');
        localStorage.removeItem('mc_patientLog');
        localStorage.removeItem('mc_lastTicket');

        saveState();
      }
    }

    function renderUI() {
      const query = document.getElementById('staff-search').value.toLowerCase().trim();

      // 1. RENDER CURRENTLY SERVING CARD
      const servingContainer = document.getElementById('serving-card-content');
      if (state.currentlyServing) {
        servingContainer.innerHTML = `
          <div class="text-6xl font-extrabold text-emerald-400 tracking-tight my-2">
            ${state.currentlyServing.ticketNo}
          </div>
          <div class="text-lg font-bold text-white">${state.currentlyServing.name}</div>
          <p class="text-xs text-gray-400 mt-0.5">
            IC: ${state.currentlyServing.icNumber} • Called at ${state.currentlyServing.calledAt}
          </p>
          <div class="flex gap-3 mt-5">
            <button onclick="callNextPatient()" ${state.queue.length === 0 ? 'disabled' : ''} 
              class="flex-1 bg-emerald-500 hover:bg-emerald-400 disabled:opacity-40 disabled:hover:bg-emerald-500 text-slate-950 font-bold py-2.5 px-4 rounded-lg transition text-sm">
              Call Next Patient →
            </button>
            <button onclick="finishServing()" class="bg-rose-500/90 hover:bg-rose-500 text-white font-bold py-2.5 px-6 rounded-lg transition text-sm">
              Finish / Mark Done
            </button>
          </div>
        `;
      } else {
        servingContainer.innerHTML = `
          <div class="py-6 text-center">
            <p class="text-gray-400 text-sm mb-4">No patient currently in consultation.</p>
            <button onclick="callNextPatient()" ${state.queue.length === 0 ? 'disabled' : ''} 
              class="bg-emerald-500 hover:bg-emerald-400 disabled:opacity-40 text-slate-950 font-bold py-2.5 px-6 rounded-lg transition text-sm">
              Call Next Patient (${state.queue.length} Waiting)
            </button>
          </div>
        `;
      }

      // 2. RENDER WAITING QUEUE (Filtered)
      const filteredQueue = state.queue.filter(p => 
        p.name.toLowerCase().includes(query) || p.icNumber.includes(query)
      );

      document.getElementById('waiting-patients-title').innerText = `Waiting Patients (${filteredQueue.length})`;

      const waitingListContainer = document.getElementById('waiting-patients-list');
      if (filteredQueue.length === 0) {
        waitingListContainer.innerHTML = `<p class="text-center text-gray-500 text-xs py-4">No patients currently waiting</p>`;
      } else {
        waitingListContainer.innerHTML = filteredQueue.map((p, index) => `
          <div class="bg-[#122320]/60 border border-emerald-900/30 p-3 rounded-lg flex justify-between items-center">
            <div class="flex items-center gap-4">
              <span class="font-bold text-emerald-400 text-base">${p.ticketNo}</span>
              <div>
                <p class="text-xs font-semibold text-white">${p.name}</p>
                <p class="text-[10px] text-gray-400">IC: ${p.icNumber}</p>
              </div>
            </div>
            <div class="text-right">
              <span class="text-[10px] text-gray-400 block">Reg: ${p.registeredAt}</span>
              <span class="text-[10px] text-emerald-400/80 font-medium">#${index + 1} in line</span>
            </div>
          </div>
        `).join('');
      }

      // 3. RENDER PATIENT LOG (Filtered)
      const filteredLog = state.patientLog.filter(p => 
        p.name.toLowerCase().includes(query) || p.icNumber.includes(query)
      );

      const todayStr = new Date().toLocaleDateString("en-GB", { day: '2-digit', month: 'short', year: 'numeric' });
      document.getElementById('log-title').innerText = `Today's Patient Log (${todayStr})`;
      document.getElementById('served-count-badge').innerText = `${state.patientLog.length} served`;

      const logListContainer = document.getElementById('patient-log-list');
      if (filteredLog.length === 0) {
        logListContainer.innerHTML = `<p class="text-center text-gray-500 text-xs py-4">No completed sessions logged</p>`;
      } else {
        logListContainer.innerHTML = filteredLog.map(p => `
          <div class="bg-[#122320]/30 border border-emerald-900/20 p-3 rounded-lg flex justify-between items-center">
            <div class="flex items-center gap-4">
              <span class="font-bold text-gray-300 text-sm">${p.ticketNo}</span>
              <div>
                <p class="text-xs font-semibold text-gray-200">${p.name}</p>
                <p class="text-[10px] text-gray-400">IC: ${p.icNumber}</p>
              </div>
            </div>
            <div class="text-right">
              <span class="text-[10px] bg-emerald-900/40 text-emerald-300 px-2 py-0.5 rounded border border-emerald-800/40">Completed</span>
              <p class="text-[10px] text-gray-400 mt-1">${p.completedAt}</p>
            </div>
          </div>
        `).join('');
      }
    }

    renderUI();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mini Clinic — Patient Kiosk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6FAF9; --paper-2:#EAF2F0; --ink:#0F2A2E; --ink-soft:#4B6560;
  --teal:#146B62; --teal-deep:#0C4A44; --coral:#C94430; --line:#CFE0DC;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1B1A; --paper-2:#142524; --ink:#EAF3F1; --ink-soft:#9FBDB7;
    --teal:#4FBFAF; --teal-deep:#7FDCCB; --coral:#EF7B64; --line:#23413C;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1B1A; --paper-2:#142524; --ink:#EAF3F1; --ink-soft:#9FBDB7;
  --teal:#4FBFAF; --teal-deep:#7FDCCB; --coral:#EF7B64; --line:#23413C;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
*{box-sizing:border-box;}
body{margin:0; min-height:100%; background:var(--paper); color:var(--ink); font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;}
.wrap{max-width:520px; margin:0 auto; padding:28px 20px 48px;}
.brand{display:flex; align-items:center; gap:10px; margin-bottom:20px;}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--teal);display:flex;align-items:center;justify-content:center;flex:none;}
.brand .mark svg{width:18px;height:18px;}
.brand h1{font-size:1.15rem;font-weight:700;margin:0;letter-spacing:-0.01em;}
.brand .sub{color:var(--ink-soft);font-size:.8rem;display:block;margin-top:1px;}
.greeting{font-size:1.1rem;font-weight:600;color:var(--teal);margin-bottom:12px;text-align:center;}
.card{background:var(--paper-2);border:1px solid var(--line);border-radius:14px;padding:26px;text-align:center;}
.label{font-size:.72rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;}
.num{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:3.4rem;letter-spacing:.04em;line-height:1;}
.seam{border-top:2px dashed var(--line);margin:20px -26px;position:relative;}
.seam::before,.seam::after{content:"";position:absolute;top:-11px;width:22px;height:22px;border-radius:50%;background:var(--paper);}
.seam::before{left:-11px;} .seam::after{right:-11px;}
.status{font-size:.95rem;color:var(--ink-soft);margin-top:4px;}
.status.now{color:var(--coral);font-weight:700;animation:pulse 1.1s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.55;}}
button.primary{margin-top:20px;width:100%;padding:14px;border:none;border-radius:10px;background:var(--teal);color:#fff;font:inherit;font-weight:600;font-size:1rem;cursor:pointer;}
button.primary:active{background:var(--teal-deep);}
button.primary:disabled{opacity:0.6;cursor:not-allowed;}
button.ghost{margin-top:12px;background:none;border:none;color:var(--ink-soft);font:inherit;font-size:.85rem;text-decoration:underline;cursor:pointer;padding:4px;}
.tg-btn{display:inline-block;width:100%;padding:12px;margin-top:14px;background:#0088cc;color:#fff;border-radius:10px;text-decoration:none;font-weight:600;font-size:.9rem;}
.tg-btn:hover{background:#0077b5;}
.tg-status{margin-top:12px;padding:8px;background:rgba(20,107,98,0.1);border-radius:8px;font-size:.85rem;color:var(--teal);font-weight:700;}
.actions{text-align:center;margin-top:22px;}
.field{text-align:left;margin-bottom:14px;}
.fieldLabel{font-size:.72rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:6px;}
.idInput{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:.95rem;}
.idInput:focus{outline:2px solid var(--teal);outline-offset:1px;}
.fieldErr{color:var(--coral);font-size:.8rem;margin-top:6px;min-height:1em;}
.empty{color:var(--ink-soft);font-size:.9rem;margin-top:18px;}
footer{text-align:center;margin-top:32px;color:var(--ink-soft);font-size:.78rem;}
.dev-tools{margin-top:24px;padding-top:16px;border-top:1px dashed var(--line);display:flex;justify-content:center;gap:12px;flex-wrap:wrap;}
.manual-tg{margin-top:10px;display:flex;gap:6px;}
.manual-tg input{padding:8px;border-radius:6px;border:1px solid var(--line);font-size:.8rem;flex:1;}
.manual-tg button{padding:8px 12px;background:var(--teal);color:#fff;border:none;border-radius:6px;font-size:.8rem;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 2v20M2 12h20"/></svg></div>
    <div><h1>Queue System</h1><span class="sub">Mini Clinic — Patient Kiosk</span></div>
  </div>

  <div id="greetingHeader" class="greeting"></div>

  <div class="card" id="patientCard"></div>
  <div class="actions">
    <div id="takeSection">
      <div class="field">
        <label for="nameInput" class="fieldLabel">Full Name (Letters Only)</label>
        <input type="text" id="nameInput" class="idInput" placeholder="e.g. John Doe" autocomplete="off">
      </div>
      <div class="field">
        <label for="idInput" class="fieldLabel">Identification Number (Digits Only)</label>
        <input type="text" id="idInput" class="idInput" placeholder="e.g. 102030" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
        <div class="fieldErr" id="formErr"></div>
      </div>
      <button class="primary" id="takeBtn">Take a queue number</button>
    </div>

    <div class="dev-tools">
      <button class="ghost" id="simBtn">+ simulate arrival</button>
    </div>

    <div class="empty" id="patientQueueInfo">Loading queue status…</div>
  </div>
  <footer id="modeNote">Connecting to live cloud…</footer>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
  const TG_BOT_TOKEN = "8985040386:AAGcYnUq7IZ55rmNdL0ypub6-fN7aMv8SoY";
  const TG_BOT_USERNAME = "miniclinickiosk_bot";

  const firebaseConfig = {
    apiKey: "AIzaSyBZ9TFjNVtcvSkj_qJsEeDgRxbCqR-u84M",
    authDomain: "clinickiosk-ffbc0.firebaseapp.com",
    databaseURL: "https://clinickiosk-ffbc0-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "clinickiosk-ffbc0",
    storageBucket: "clinickiosk-ffbc0.firebasestorage.app",
    messagingSenderId: "657601053327",
    appId: "1:657601053327:web:9b9adf3bd4f1f3810826fa",
    measurementId: "G-KCBXXT70PY"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let ticketsList = [];
  let servingCreatedAt = null;
  let myTicket = null;
  let pendingSubmissionId = null;
  
  // Track alert states to avoid repeating audio chimes constantly
  let hasAlertedForCurrentTurn = false;
  let hasAlerted2Ahead = false;
  
  let audioCtx = null;
  let tgPollTimer = null;

  function getTimeGreeting(){
    const hr = new Date().getHours();
    if(hr < 12) return "Good morning";
    if(hr < 18) return "Good afternoon";
    return "Good evening";
  }

  function requestNotificationPermission(){
    if ("Notification" in window && Notification.permission === "default") {
      Notification.requestPermission();
    }
  }

  function initAudio(){
    try {
      if(!audioCtx){
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) audioCtx = new AudioCtx();
      }
      if(audioCtx && audioCtx.state === 'suspended'){
        audioCtx.resume();
      }
    } catch(e) {}
  }

  function playTurnChime(){
    try {
      initAudio();
      if(!audioCtx) return;
      const now = audioCtx.currentTime;

      const osc1 = audioCtx.createOscillator();
      const gain1 = audioCtx.createGain();
      osc1.type = 'triangle';
      osc1.frequency.setValueAtTime(523.25, now);
      gain1.gain.setValueAtTime(0.95, now);
      gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
      osc1.connect(gain1);
      gain1.connect(audioCtx.destination);
      osc1.start(now);
      osc1.stop(now + 0.5);

      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(659.25, now + 0.2);
      gain2.gain.setValueAtTime(0.95, now + 0.2);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
      osc2.connect(gain2);
      gain2.connect(audioCtx.destination);
      osc2.start(now + 0.2);
      osc2.stop(now + 0.8);

      const osc3 = audioCtx.createOscillator();
      const gain3 = audioCtx.createGain();
      osc3.type = 'sine';
      osc3.frequency.setValueAtTime(783.99, now + 0.4);
      gain3.gain.setValueAtTime(0.95, now + 0.4);
      gain3.gain.exponentialRampToValueAtTime(0.001, now + 1.1);
      osc3.connect(gain3);
      gain3.connect(audioCtx.destination);
      osc3.start(now + 0.4);
      osc3.stop(now + 1.1);
    } catch(e){}
  }

  function notifyPatientTurn(ticketStr, patientName){
    playTurnChime();
    if ("Notification" in window && Notification.permission === "granted") {
      try {
        new Notification("🏥 Mini Clinic — IT'S YOUR TURN!", {
          body: `Ticket ${ticketStr} (${patientName}): Please proceed into the consultation room now.`,
          tag: "clinic-turn-alert",
          requireInteraction: true
        });
      } catch(e){}
    }
  }

  function notifyPatient2Ahead(ticketStr, patientName){
    playTurnChime();
    if ("Notification" in window && Notification.permission === "granted") {
      try {
        new Notification("🔔 Mini Clinic Queue Alert", {
          body: `Ticket ${ticketStr} (${patientName}): 2 people ahead of you! Please prepare to head over.`,
          tag: "clinic-2ahead-alert"
        });
      } catch(e){}
    }
  }

  const fmt = n => 'A' + String(n).padStart(3, '0');

  function getTicketNumber(t){
    if(!t) return 1;
    const idx = ticketsList.findIndex(x => x.id === t.id);
    if(idx !== -1) return idx + 1;
    const countBefore = ticketsList.filter(x => x.createdAt < t.createdAt).length;
    return countBefore + 1;
  }

  function getWaitingTickets(){
    if(!servingCreatedAt) return ticketsList;
    return ticketsList.filter(t => t.createdAt > servingCreatedAt);
  }

  function saveMyTicket(){ 
    try{ 
      if(myTicket) localStorage.setItem('miniclinic_ticket', JSON.stringify(myTicket));
      else localStorage.removeItem('miniclinic_ticket');
    }catch(e){} 
  }

  function loadMyTicket(){ 
    try{ 
      const s = localStorage.getItem('miniclinic_ticket'); 
      if(s) myTicket = JSON.parse(s); 
    }catch(e){} 
  }

  function clearMyTicket(){
    if(tgPollTimer) clearInterval(tgPollTimer);
    myTicket = null;
    hasAlertedForCurrentTurn = false;
    hasAlerted2Ahead = false;
    try{ localStorage.removeItem('miniclinic_ticket'); }catch(e){}
  }

  function startTelegramPolling(ticketId, ticketStr){
    if(tgPollTimer) clearInterval(tgPollTimer);
    tgPollTimer = setInterval(() => {
      fetch(`https://api.telegram.org/bot${TG_BOT_TOKEN}/getUpdates`)
        .then(res => res.json())
        .then(data => {
          if(data.ok && data.result){
            for(let u of data.result){
              if(u.message && u.message.text){
                const text = u.message.text.toUpperCase();
                if(text.includes(ticketId.toUpperCase()) || text.includes(ticketStr.toUpperCase()) || text.includes('/START')){
                  const chatId = u.message.chat.id;
                  db.ref('tickets/' + ticketId + '/telegramChatId').set(chatId);
                  clearInterval(tgPollTimer);
                  break;
                }
              }
            }
          }
        }).catch(e => {});
    }, 2000);
  }

  function saveManualChatId(ticketId){
    const val = document.getElementById('manualChatIdInput').value.trim();
    if(!val) return;
    db.ref('tickets/' + ticketId + '/telegramChatId').set(val);
  }

  function render(){
    const greetingStr = getTimeGreeting();
    const greetingHeader = document.getElementById('greetingHeader');

    const w = getWaitingTickets();
    const countEl = document.getElementById('patientQueueInfo');
    if(countEl){
      countEl.textContent = w.length + (w.length === 1 ? ' person currently waiting' : ' people currently waiting');
    }

    const card = document.getElementById('patientCard');
    const takeSection = document.getElementById('takeSection');

    const mine = myTicket ? (ticketsList.find(x => x.id === myTicket.id) || myTicket) : null;

    if(!mine){
      greetingHeader.textContent = `${greetingStr}! Please check in below.`;
      card.innerHTML = `<div class="label">No ticket yet</div><div class="num" style="color:var(--ink-soft)">— — —</div>`;
      takeSection.style.display = 'block';
    } else {
      const patientName = mine.name ? mine.name : 'Patient';
      const ticketStr = fmt(getTicketNumber(mine));
      greetingHeader.textContent = `${greetingStr}, ${patientName}!`;

      let statusHtml;
      if(servingCreatedAt && mine.createdAt === servingCreatedAt){
        statusHtml = `<div class="status now">It's your turn — please proceed</div>`;
        if(!hasAlertedForCurrentTurn){
          notifyPatientTurn(ticketStr, patientName);
          hasAlertedForCurrentTurn = true;
        }
      } else if (servingCreatedAt && mine.createdAt < servingCreatedAt) {
        statusHtml = `<div class="status">Your turn has passed / completed</div>`;
      } else {
        const ahead = w.filter(t => t.createdAt < mine.createdAt).length;

        // Audio Chime & Push Notification Trigger when 2 people ahead
        if (ahead === 2 && !hasAlerted2Ahead) {
          notifyPatient2Ahead(ticketStr, patientName);
          hasAlerted2Ahead = true;
        }

        statusHtml = ahead === 0
          ? `<div class="status">You're next — please wait nearby</div>`
          : `<div class="status">${ahead} ${ahead === 1 ? 'person' : 'people'} ahead of you</div>`;
      }

      let tgHtml = "";
      if(mine.telegramChatId){
        tgHtml = `<div class="tg-status">✅ Telegram Alerts Active</div>`;
      } else {
        const tgLink = `https://t.me/${TG_BOT_USERNAME}?start=${ticketStr}`;
        tgHtml = `
          <a href="${tgLink}" target="_blank" class="tg-btn">📱 Enable Telegram Alerts</a>
          <div style="font-size:.75rem; color:var(--ink-soft); margin-top:6px;">Tap above and hit START, or type "<strong>${ticketStr}</strong>" in the Telegram bot chat!</div>
          <div class="manual-tg">
            <input type="text" id="manualChatIdInput" placeholder="Or enter Telegram Chat ID">
            <button onclick="saveManualChatId('${mine.id}')">Save</button>
          </div>
        `;
        startTelegramPolling(mine.id, ticketStr);
      }

      card.innerHTML = `
        <div class="label">Your ticket number</div>
        <div class="num">${ticketStr}</div>
        <div class="seam"></div>
        ${statusHtml}
        ${tgHtml}
        <button class="ghost" id="newTicketBtn" style="margin-top:16px;display:inline-block;font-weight:600;">Done / Get a new number</button>
      `;
      takeSection.style.display = 'none';

      const btn = document.getElementById('newTicketBtn');
      if(btn){
        btn.onclick = () => {
          clearMyTicket();
          render();
        };
      }
    }
  }

  db.ref().on('value', (snapshot) => {
    const data = snapshot.val() || {};
    const ticketsObj = data.tickets || {};
    
    ticketsList = Object.values(ticketsObj).sort((a, b) => a.createdAt - b.createdAt);
    servingCreatedAt = data.servingCreatedAt || null;

    if (myTicket) {
      const existsInDb = ticketsList.some(t => t.id === myTicket.id);
      if (!existsInDb && pendingSubmissionId !== myTicket.id) {
        clearMyTicket();
      }
    }

    document.getElementById('modeNote').textContent = 'Connected — live Firebase cloud kiosk';
    render();
  }, (error) => {
    document.getElementById('modeNote').textContent = "Can't connect to live database.";
  });

  const nameInput = document.getElementById('nameInput');
  const idInput = document.getElementById('idInput');
  const takeBtn = document.getElementById('takeBtn');
  const formErr = document.getElementById('formErr');

  nameInput.addEventListener('input', e => {
    e.target.value = e.target.value.replace(/[^a-zA-Z\s]/g, '');
    formErr.textContent = '';
  });

  idInput.addEventListener('input', e => {
    e.target.value = e.target.value.replace(/\D/g, '');
    formErr.textContent = '';
  });

  takeBtn.onclick = (e) => {
    if(e) e.preventDefault();
    initAudio();
    requestNotificationPermission();
    
    const nameVal = nameInput.value.trim();
    const idVal = idInput.value.trim();

    if(!nameVal){ 
      formErr.textContent = 'Please enter your full name'; 
      nameInput.focus(); 
      return; 
    }

    if(!idVal){ 
      formErr.textContent = 'Please enter your identification number'; 
      idInput.focus(); 
      return; 
    }

    if(!/^\d+$/.test(idVal)){
      formErr.textContent = 'ID must contain numbers only';
      idInput.focus();
      return;
    }

    formErr.textContent = '';
    takeBtn.disabled = true;

    const ticketId = 't_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6);
    const newTicket = {
      id: ticketId,
      name: nameVal,
      idNumber: idVal,
      createdAt: Date.now()
    };

    pendingSubmissionId = ticketId;
    myTicket = newTicket;
    hasAlertedForCurrentTurn = false;
    hasAlerted2Ahead = false;
    saveMyTicket();
    render();

    db.ref('tickets/' + ticketId).set(newTicket).then(() => {
      pendingSubmissionId = null;
      nameInput.value = '';
      idInput.value = '';
      takeBtn.disabled = false;
    }).catch((err) => {
      pendingSubmissionId = null;
      clearMyTicket();
      takeBtn.disabled = false;
      formErr.textContent = "Error issuing ticket. Try again.";
      render();
    });
  };

  document.getElementById('simBtn').onclick = (e) => {
    if(e) e.preventDefault();
    initAudio();
    const simId = 't_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6);
    const sampleNames = ["Ali Hassan", "Siti Nurhaliza", "Tan Wei Ming", "Muthu Raman", "Ahmad Zaki"];
    const simTicket = {
      id: simId,
      name: sampleNames[Math.floor(Math.random() * sampleNames.length)],
      idNumber: String(Math.floor(10000 + Math.random() * 90000)),
      createdAt: Date.now()
    };
    db.ref('tickets/' + simId).set(simTicket);
  };

  idInput.addEventListener('keydown', e => { 
    if(e.key === 'Enter') takeBtn.click(); 
  });

  document.addEventListener('touchstart', () => { initAudio(); requestNotificationPermission(); }, { once: true });
  document.addEventListener('click', () => { initAudio(); requestNotificationPermission(); }, { once: true });

  loadMyTicket();
</script>
</body>
</html>

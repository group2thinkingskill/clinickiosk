<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mini Clinic — Patient Kiosk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6FAF9; --paper-2:#EAF2F0; --ink:#0F2A2E; --ink-soft:#4B6560;
  --teal:#146B62; --teal-deep:#0C4A44; --coral:#C94430; --line:#CFE0DC;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1B1A; --paper-2:#142524; --ink:#EAF3F1; --ink-soft:#9FBDB7;
    --teal:#4FBFAF; --teal-deep:#7FDCCB; --coral:#EF7B64; --line:#23413C;
  }
}
body{margin:0; min-height:100%; background:var(--paper); color:var(--ink); font-family:'Space Grotesk',system-ui,sans-serif;}
.wrap{max-width:520px; margin:0 auto; padding:28px 20px 48px;}
.brand{display:flex; align-items:center; gap:10px; margin-bottom:20px;}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--teal);display:flex;align-items:center;justify-content:center;}
.brand h1{font-size:1.15rem;font-weight:700;margin:0;}
.brand .sub{color:var(--ink-soft);font-size:.8rem;display:block;}
.greeting{font-size:1.1rem;font-weight:600;color:var(--teal);margin-bottom:12px;text-align:center;}
.card{background:var(--paper-2);border:1px solid var(--line);border-radius:14px;padding:26px;text-align:center;}
.label{font-size:.72rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;}
.num{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:3.4rem;letter-spacing:.04em;line-height:1;}
.seam{border-top:2px dashed var(--line);margin:20px -26px;position:relative;}
.seam::before,.seam::after{content:"";position:absolute;top:-11px;width:22px;height:22px;border-radius:50%;background:var(--paper);}
.seam::before{left:-11px;} .seam::after{right:-11px;}
.status{font-size:.95rem;color:var(--ink-soft);margin-top:4px;}
.status.now{color:var(--coral);font-weight:700;}
.est-time{font-size:0.88rem;color:var(--ink-soft);margin-top:8px;font-weight:500;}
button.primary{margin-top:20px;width:100%;padding:14px;border:none;border-radius:10px;background:var(--teal);color:#fff;font:inherit;font-weight:600;font-size:1rem;cursor:pointer;}
button.ghost{margin-top:12px;background:none;border:none;color:var(--ink-soft);font:inherit;font-size:.85rem;text-decoration:underline;cursor:pointer;}
button.add-person{margin-top:14px;width:100%;padding:10px;border:1px dashed var(--teal);border-radius:10px;background:rgba(20,107,98,0.05);color:var(--teal);font:inherit;font-weight:600;font-size:0.85rem;cursor:pointer;}
button.add-person:active{background:rgba(20,107,98,0.15);}
.field{text-align:left;margin-bottom:14px;}
.fieldLabel{font-size:.72rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:6px;}
.idInput{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:.95rem;}
.fieldErr{color:var(--coral);font-size:.8rem;margin-top:6px;font-weight:500;}
.empty{color:var(--ink-soft);font-size:.9rem;margin-top:18px;}
footer{text-align:center;margin-top:32px;color:var(--ink-soft);font-size:.78rem;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 2v20M2 12h20"/></svg></div>
    <div><h1>Queue System</h1><span class="sub">Mini Clinic — Patient Kiosk</span></div>
  </div>

  <div id="greetingHeader" class="greeting"></div>
  <div class="card" id="patientCard"></div>

  <div class="actions">
    <div id="takeSection">
      <div class="field">
        <label for="nameInput" class="fieldLabel">Full Name (Letters Only)</label>
        <input type="text" id="nameInput" class="idInput" placeholder="e.g. Ahmad Sattiya" autocomplete="off">
      </div>
      <div class="field">
        <label for="idInput" class="fieldLabel">Malaysian IC Number (12 Digits Only)</label>
        <input type="text" id="idInput" class="idInput" placeholder="e.g. 020512085432" inputmode="numeric" maxlength="12" autocomplete="off">
        <div class="fieldErr" id="formErr"></div>
      </div>
      <button class="primary" id="takeBtn">Take a queue number</button>
    </div>
    <div class="empty" id="patientQueueInfo">Loading queue status…</div>
    <button class="add-person" id="addPersonBtn">+ Add Test Person (Demo Simulation)</button>
  </div>
  <footer id="modeNote">Connecting to live cloud…</footer>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBZ9TFjNVtcvSkj_qJsEeDgRxbCqR-u84M",
    authDomain: "clinickiosk-ffbc0.firebaseapp.com",
    databaseURL: "https://clinickiosk-ffbc0-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "clinickiosk-ffbc0",
    storageBucket: "clinickiosk-ffbc0.firebasestorage.app",
    messagingSenderId: "657601053327",
    appId: "1:657601053327:web:9b9adf3bd4f1f3810826fa",
    measurementId: "G-KCBXXT70PY"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let ticketsList = [];
  let servingCreatedAt = null;
  let servingCalledAt = null;
  let myTicket = null;
  let audioCtx = null;
  let lastPlayedTurnKey = null;
  let lastPlayedAheadKey = null;

  function initAudio(){
    try {
      if(!audioCtx){
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) audioCtx = new AudioCtx();
      }
      if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    } catch(e) {}
  }

  window.addEventListener('click', initAudio, { once: true });
  window.addEventListener('touchstart', initAudio, { once: true });

  function playTurnAlarm(){
    try {
      initAudio();
      if(!audioCtx) return;
      const chimeTimes = [0.0, 0.6, 1.2, 1.8];
      chimeTimes.forEach(timeOffset => {
        const now = audioCtx.currentTime + timeOffset;
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(1046.50, now);
        gain1.gain.setValueAtTime(0.7, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(now);
        osc1.stop(now + 0.35);

        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(1318.51, now + 0.15);
        gain2.gain.setValueAtTime(0.7, now + 0.15);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now + 0.15);
        osc2.stop(now + 0.5);
      });
    } catch(e){}
  }

  function playAheadWarningAlarm(){
    try {
      initAudio();
      if(!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(587.33, now);
      gain.gain.setValueAtTime(0.8, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.3);
    } catch(e){}
  }

  const fmt = n => 'A' + String(n).padStart(3, '0');

  function getWaitingTickets(){
    if(!servingCreatedAt) return ticketsList;
    return ticketsList.filter(t => t.createdAt > servingCreatedAt);
  }

  function saveMyTicket(){ 
    try{ 
      if(myTicket) localStorage.setItem('miniclinic_ticket', JSON.stringify(myTicket));
      else localStorage.removeItem('miniclinic_ticket');
    }catch(e){} 
  }

  function loadMyTicket(){ 
    try{ 
      const s = localStorage.getItem('miniclinic_ticket'); 
      if(s) myTicket = JSON.parse(s); 
    }catch(e){} 
  }

  function clearMyTicket(){
    myTicket = null;
    lastPlayedTurnKey = null;
    lastPlayedAheadKey = null;
    try{ localStorage.removeItem('miniclinic_ticket'); }catch(e){}
  }

  function render(){
    const hr = new Date().getHours();
    const greetingStr = hr < 12 ? "Good morning" : hr < 18 ? "Good afternoon" : "Good evening";

    let mine = myTicket ? (ticketsList.find(x => x.id === myTicket.id) || myTicket) : null;

    if(myTicket && ticketsList.length > 0 && !ticketsList.some(x => x.id === myTicket.id)){
      clearMyTicket();
      mine = null;
    }

    if (mine && mine.name) {
      document.getElementById('greetingHeader').textContent = `${greetingStr}, ${mine.name}!`;
    } else {
      document.getElementById('greetingHeader').textContent = `${greetingStr}!`;
    }

    const w = getWaitingTickets();
    document.getElementById('patientQueueInfo').textContent = w.length + (w.length === 1 ? ' person currently waiting' : ' people currently waiting');

    const card = document.getElementById('patientCard');
    const takeSection = document.getElementById('takeSection');

    if(!mine){
      card.innerHTML = `<div class="label">No ticket yet</div><div class="num" style="color:var(--ink-soft)">— — —</div>`;
      takeSection.style.display = 'block';
    } else {
      const ticketStr = mine.ticketNumber || fmt(mine.ticketSeq);
      let statusHtml;
      let isMyTurn = (servingCreatedAt && mine.createdAt === servingCreatedAt);

      if(isMyTurn){
        statusHtml = `<div class="status now">It's your turn — please proceed</div><div class="est-time">Est. wait: <strong style="color:var(--coral)">Now</strong></div>`;
        
        const turnKey = mine.id + '_' + servingCreatedAt;
        if (lastPlayedTurnKey !== turnKey) {
          lastPlayedTurnKey = turnKey;
          playTurnAlarm();
        }

      } else if (servingCreatedAt && mine.createdAt < servingCreatedAt) {
        statusHtml = `<div class="status">Your turn has passed / completed</div>`;
      } else {
        const ahead = w.filter(t => t.createdAt < mine.createdAt).length;
        
        const currentSessionElapsedMinutes = servingCalledAt ? Math.floor((Date.now() - servingCalledAt) / 60000) : 0;
        const currentPatientWait = servingCreatedAt ? (1 + Math.max(0, currentSessionElapsedMinutes - 1)) : 0;
        const estMinutes = (ahead * 1) + currentPatientWait;
        
        if (ahead === 2) {
          const aheadKey = mine.id + '_ahead_2';
          if (lastPlayedAheadKey !== aheadKey) {
            lastPlayedAheadKey = aheadKey;
            playAheadWarningAlarm();
          }
        }

        const personText = ahead === 0 ? "You're next — please wait nearby" : `${ahead} ${ahead === 1 ? 'person' : 'people'} ahead of you`;
        statusHtml = `
          <div class="status">${personText}</div>
          <div class="est-time">Est. wait time: ~<strong>${estMinutes} ${estMinutes === 1 ? 'minute' : 'minutes'}</strong></div>
        `;
      }

      card.innerHTML = `
        <div class="label">Your ticket number</div>
        <div class="num">${ticketStr}</div>
        <div class="seam"></div>
        ${statusHtml}
        <button class="ghost" id="newTicketBtn" style="margin-top:16px;display:inline-block;font-weight:600;">Done / Get a new number</button>
      `;
      takeSection.style.display = 'none';

      document.getElementById('newTicketBtn').onclick = () => {
        clearMyTicket();
        render();
      };
    }
  }

  document.getElementById('addPersonBtn').onclick = () => {
    initAudio();
    const demoNames = ["Siti Aminah", "Ahmad Zaki", "Ravi Kumar", "Chong Wei", "Nurul Ain", "Lim Mei Ling"];
    const randomName = demoNames[Math.floor(Math.random() * demoNames.length)];
    const randomIc = '05' + Math.floor(1000000000 + Math.random() * 9000000000);
    const ticketId = 't_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6);

    db.ref().transaction((currentData) => {
      currentData = currentData || {};
      currentData.lastSequence = (currentData.lastSequence || 0) + 1;
      const seqNumber = currentData.lastSequence;

      currentData.tickets = currentData.tickets || {};
      currentData.tickets[ticketId] = {
        id: ticketId,
        ticketNumber: fmt(seqNumber),
        ticketSeq: seqNumber,
        name: randomName,
        idNumber: randomIc,
        createdAt: Date.now()
      };
      return currentData;
    });
  };

  db.ref().on('value', (snapshot) => {
    const data = snapshot.val() || {};
    ticketsList = Object.values(data.tickets || {}).sort((a, b) => a.createdAt - b.createdAt);
    servingCreatedAt = data.servingCreatedAt || null;
    servingCalledAt = data.servingCalledAt || null;

    if (ticketsList.length === 0 && myTicket) {
      clearMyTicket();
    }

    document.getElementById('modeNote').textContent = 'Connected — live Firebase cloud kiosk';
    render();
  });

  setInterval(render, 5000);

  const nameInput = document.getElementById('nameInput');
  const idInput = document.getElementById('idInput');
  const takeBtn = document.getElementById('takeBtn');
  const formErr = document.getElementById('formErr');

  nameInput.addEventListener('input', e => { e.target.value = e.target.value.replace(/[^a-zA-Z\s]/g, ''); formErr.textContent = ''; });
  idInput.addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 12); formErr.textContent = ''; });

  takeBtn.onclick = (e) => {
    if(e) e.preventDefault();
    initAudio();
    
    const nameVal = nameInput.value.trim();
    const idVal = idInput.value.trim();

    if(!nameVal){ formErr.textContent = 'Please enter your full name'; nameInput.focus(); return; }
    if(!idVal || idVal.length !== 12){ formErr.textContent = 'IC number must be exactly 12 digits'; idInput.focus(); return; }

    formErr.textContent = '';
    takeBtn.disabled = true;
    const ticketId = 't_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6);

    db.ref().transaction((currentData) => {
      currentData = currentData || {};
      currentData.lastSequence = (currentData.lastSequence || 0) + 1;
      const seqNumber = currentData.lastSequence;

      currentData.tickets = currentData.tickets || {};
      currentData.tickets[ticketId] = {
        id: ticketId,
        ticketNumber: fmt(seqNumber),
        ticketSeq: seqNumber,
        name: nameVal,
        idNumber: idVal,
        createdAt: Date.now()
      };
      return currentData;
    }, (error, committed, snapshot) => {
      takeBtn.disabled = false;
      if (error || !committed) {
        formErr.textContent = 'Failed to assign queue number. Please try again.';
        return;
      }
      const data = snapshot.val() || {};
      const savedTicket = data.tickets ? data.tickets[ticketId] : null;
      if (savedTicket) {
        myTicket = savedTicket;
        saveMyTicket();
        nameInput.value = '';
        idInput.value = '';
        render();
      }
    });
  };

  loadMyTicket();
</script>
</body>
</html>
